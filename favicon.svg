<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184232"/>
      <stop offset="100%" stop-color="#0E281D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- High-Contrast Squircle Tile (Clear on dark & light browser tabs) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Iconic Geometric 'K' Monogram (Bold 76px strokes, razor-sharp at 16x16) -->
  <g>
    <!-- Vertical Pillar: Pure White -->
    <rect x="114" y="112" width="76" height="288" rx="20" fill="#FFFFFF"/>

    <!-- Lower Leg: Pure White -->
    <line x1="190" y1="266" x2="366" y2="386" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round"/>

    <!-- Upper Arm: Radiant Amber Gold -->
    <line x1="190" y1="246" x2="366" y2="126" stroke="url(#gold)" stroke-width="76" stroke-linecap="round"/>
  </g>
</svg>